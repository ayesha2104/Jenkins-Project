apiVersion: v1
kind: Service
metadata:
  name: react-vite-service
  namespace: react-app
  labels:
    app: react-vite-app
  annotations:
    # Classic ELB in front of the pods; this is what makes the app reachable
    # from a browser outside the cluster.
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: react-vite-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
