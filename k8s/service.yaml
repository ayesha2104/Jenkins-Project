apiVersion: v1
kind: Service
metadata:
  name: react-vite-service
  namespace: react-app
  labels:
    app: react-vite-app
  # No aws-load-balancer-type annotation on purpose. Setting it to "external"
  # hands provisioning to the AWS Load Balancer Controller add-on, which is not
  # installed here, and the service would sit at <pending> forever. Leaving it
  # off lets the in-tree EKS controller create an internet-facing Classic ELB.
spec:
  type: LoadBalancer
  selector:
    app: react-vite-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
