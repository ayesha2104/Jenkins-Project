server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html so client-side
    # routing works instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable, so they can cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Plain endpoint for the Kubernetes readiness and liveness probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
